<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The server fills the placeholder tokens below with the configured panel
      name, description, logo and URL before this page is sent. This is what
      Discord, WhatsApp and Telegram read when a link is pasted, so the preview
      reflects the operator's branding instead of a hard-coded string.
    -->
    <meta name="description" content="%PANEL_DESCRIPTION%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%PANEL_NAME%" />
    <meta property="og:title" content="%PANEL_NAME%" />
    <meta property="og:description" content="%PANEL_DESCRIPTION%" />
    <meta property="og:url" content="%PANEL_URL%" />
    <meta property="og:image" content="%PANEL_LOGO_URL%" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%PANEL_NAME%" />
    <meta name="twitter:description" content="%PANEL_DESCRIPTION%" />
    <meta name="twitter:image" content="%PANEL_LOGO_URL%" />

    <link rel="icon" href="%PANEL_LOGO_URL%" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <title>%PANEL_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
