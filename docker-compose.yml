version: '3.8'
services:
  ivm-main:
    build: .
    container_name: ivm-main
    restart: unless-stopped
    ports:
      - "6767:6767"
      - "6868:6868"
    environment:
      - NODE_ENV=production
      - PORT=6767
      - ENABLE_DOCKER=true
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - IVM_HOST_DATA_PATH=${PWD}/.data
      - IVM_OWNER_USER=${IVM_OWNER_USER:-}
      - IVM_OWNER_PASS=${IVM_OWNER_PASS:-}
    volumes:
      - ./.data:/app/.data
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock

  ivm-admin:
    build: .
    container_name: ivm-admin
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3000:3000"
      - "6869:6869"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - ENABLE_DOCKER=true
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - IVM_HOST_DATA_PATH=${PWD}/.data
      - IVM_OWNER_USER=${IVM_OWNER_USER:-}
      - IVM_OWNER_PASS=${IVM_OWNER_PASS:-}
    volumes:
      - ./.data:/app/.data
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock
